## To build this documentation using mkdocs :
##    python -m pip install mkdocs pymdown-extensions plantuml_markdown
##    mkdocs build --clean --strict ; mkdocs serve
##    # Open the browser at http://localhost:8000
##
## Diagrams: the current pages use Mermaid, which renders client-side and needs no extra tooling.
## The plantuml_markdown extension is enabled and the CMake core_doc target stages plantuml.jar,
## so a Java runtime is needed ONLY if you add PlantUML (@startuml) diagrams. To enable that, put
## the plantuml launcher (cmake/doc_tools/) on PATH:
##    Linux  : chmod +x plantuml ; export PATH=$PATH:/path/to/dir/containing/plantuml
##    Windows: set PATH=%PATH%;C:\path\to\dir\containing\plantuml
##
## Note: if the python doc packages (mkdocs / pymdown-extensions / plantuml_markdown) are missing
## when building via CMake, the `core_doc` target is silently skipped with only a warning
## (see documentation/CMakeLists.txt).
##
site_name: Bitcoin Development Kit

nav:
    - About : index.md
    - Directory Structure : directories.md
    - Development Build : build.md
    - Architecture : architecture.md
    - Rust Binding : rust_binding.md
    - VerifyScript : verify_script.md
    - Versioning strategy : versioning.md
    - Object Model : ObjectModel.md

markdown_extensions:
  - toc:
  - pymdownx.arithmatex
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - plantuml_markdown:

extra_javascript:
  - 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_CHTML' # mathjax
  - 'https://unpkg.com/mermaid@8.4.6/dist/mermaid.min.js'

theme: readthedocs
