## Build and view from the BDK repository root, using the Python environment
## prepared in documentation/docs/build.md (BDK_DOC_PYTHON is its interpreter):
##   "$BDK_DOC_PYTHON" -m mkdocs build --config-file documentation/mkdocs.yml --clean --strict --site-dir "$(cd .. && pwd)/build/generated/core_doc"
##   "$BDK_DOC_PYTHON" -m http.server --directory ../build/generated/core_doc 8000
## Open http://localhost:8000 and stop the server with Ctrl-C after inspection.
## These commands match the Development Build page; verify both there and here
## when changing the documentation toolchain.
##
## Mermaid diagrams render in the browser and require no Java build tooling.
## plantuml_markdown remains enabled; Java and the cmake/doc_tools launcher
## are needed only if PlantUML diagrams are added. Current pages use Mermaid.
##
## CMake discovers MkDocs and all enabled extensions in one Python environment.
## Select an interpreter with -DBDK_DOC_PYTHON_EXECUTABLE=/path/to/python.
## If no candidate has all extensions, core_doc is omitted with a warning.
## See documentation/CMakeLists.txt and cmake/modules/FindPythonHelper.cmake.

site_name: Bitcoin Development Kit

nav:
    - About : index.md
    - Architecture : architecture.md
    - Directory Structure : directories.md
    - Development Build : build.md
    - Debugging transaction validation : debug_transaction.md
    - VerifyScript : verify_script.md
    - Versioning strategy : versioning.md
    - Object Model : ObjectModel.md

markdown_extensions:
  - toc:
  - pymdownx.arithmatex
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - plantuml_markdown:

extra_javascript:
  - 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_CHTML' # mathjax
  - 'https://unpkg.com/mermaid@8.4.6/dist/mermaid.min.js'

theme: readthedocs
