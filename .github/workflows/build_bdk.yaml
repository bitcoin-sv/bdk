name: Build BDK

## This is the SINGLE manual dispatch entry for the build-and-commit pipeline. The
## wasm leg is `build_wasm.yaml`, called through `workflow_call` below; that workflow
## has no `workflow_dispatch` trigger of its own on purpose, so the two artifact
## families can never be built and published independently of the all-or-nothing
## commit gate.
##
## The two commit checkboxes are independent, and all four combinations are
## meaningful: gobdk only, wasm only, both, neither (build and test everything,
## commit nothing).
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      bitcoin-sv-commit:
        description: 'Custom bitcoin-sv commit to be used to build bdk'
        required: false
        default: 6504a3aff65ba97c0f6c80962b033e35ecbfed4b
      commit-gobdk-archives:
        description: 'Commit the gobdk static archives built by this run'
        required: true
        default: 'true'
        type: boolean
      commit-wasm-artifacts:
        description: 'Commit the typesbdk WASM artifacts built by this run'
        required: true
        default: 'true'
        type: boolean

env:
  DEFAULT_BITCOIN_SV_COMMIT: 6504a3aff65ba97c0f6c80962b033e35ecbfed4b

jobs:
  build-bdk:
    ## The C++ gates run first: a formatting diff, a clang-tidy finding or a
    ## compiler warning in first-party code fails one job instead of every leg
    ## below (clang-tidy needs clang-format, so this needs both)
    needs: clang-tidy
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04-arm
          - os: ubuntu-22.04
          - os: macos-15
      fail-fast: false
    outputs:
      modified: ${{ steps.gobdk_change.outputs.modified }}
    runs-on: ${{ matrix.os }}

    env:
      GO111MODULE : on
      GOFLAGS : -mod=vendor

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Set up Go 1.26.0
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          check-latest: false

      - name: Define dependant bitcoin-sv commit
        id: define-bitcoin-sv-commit
        shell: bash
        run: |
          # Use dispatch input if present, otherwise default from env
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bsvcommit="${{ github.event.inputs.bitcoin-sv-commit }}"
          else
            bsvcommit="${{ env.DEFAULT_BITCOIN_SV_COMMIT }}"
          fi
          echo "Build using bsvcommit=$bsvcommit ..."
          echo "bsvcommit=$bsvcommit" >> "$GITHUB_OUTPUT"

      - name: Check out bitcoin-sv
        shell: bash
        run: |
          echo "Checking out bitcoin-sv at commit ${{ steps.define-bitcoin-sv-commit.outputs.bsvcommit }} ..."
          #git clone https://x-access-token:${{ secrets.BITCOIN_SV_PAT }}@github.com/teranode-group/bitcoin-sv-staging.git bitcoin-sv
          git clone https://github.com/bitcoin-sv/bitcoin-sv.git bitcoin-sv
          cd bitcoin-sv && git checkout ${{ steps.define-bitcoin-sv-commit.outputs.bsvcommit }} && git log -3 && pwd && cd ..
          echo "Successfully checked out bitcoin-sv commit ${{ steps.define-bitcoin-sv-commit.outputs.bsvcommit }} to bitcoin-sv"

        ## Download and setup environment varialbe
        ## BSV_ROOT, BOOST_ROOT, OPENSSL_ROOT_DIR
      - name: Prepare Environment and Dependencies Unix
        if: runner.os != 'Windows'
        run: |
          echo "BSV_ROOT=${{ github.workspace }}/bitcoin-sv" >> $GITHUB_ENV
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -U pytest junitparser mkdocs pymdown-extensions plantuml_markdown requests --break-system-packages
          echo "OS_ARCH=$(uname -s | tr 'A-Z' 'a-z')_$(uname -m)" >> $GITHUB_ENV
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            sudo apt-get update
            sudo apt-get install -y build-essential g++ wget
            wget https://github.com/bitcoin-sv/bdk/releases/download/depcy/dependancies_linux_x86_64.tar.gz
            tar -xzf dependancies_linux_x86_64.tar.gz
            echo "DEPENDENCIES_DIR=${{ github.workspace }}/dependancies_linux_x86_64" >> $GITHUB_ENV
            echo "BOOST_ROOT=${{ github.workspace }}/dependancies_linux_x86_64/boost_1.85.0" >> $GITHUB_ENV
            echo "OPENSSL_ROOT_DIR=${{ github.workspace }}/dependancies_linux_x86_64/openssl_3.4.0" >> $GITHUB_ENV
          fi
          if [[ "${{ matrix.os }}" == "ubuntu-22.04-arm" ]]; then
            sudo apt-get update
            sudo apt-get install -y build-essential g++ wget
            wget https://github.com/bitcoin-sv/bdk/releases/download/depcy/dependancies_linux_aarch64.tar.gz
            tar -xzf dependancies_linux_aarch64.tar.gz
            echo "DEPENDENCIES_DIR=${{ github.workspace }}/dependancies_linux_aarch64" >> $GITHUB_ENV
            echo "BOOST_ROOT=${{ github.workspace }}/dependancies_linux_aarch64/boost_1.85.0" >> $GITHUB_ENV
            echo "OPENSSL_ROOT_DIR=${{ github.workspace }}/dependancies_linux_aarch64/openssl_3.4.0" >> $GITHUB_ENV
          fi
          if [[ "${{ matrix.os }}" == "macos-15" ]]; then
            wget https://github.com/bitcoin-sv/bdk/releases/download/depcy/dependancies_darwin_arm64.tar.gz
            tar -xzf dependancies_darwin_arm64.tar.gz
            echo "DEPENDENCIES_DIR=${{ github.workspace }}/dependancies_darwin_arm64" >> $GITHUB_ENV
            echo "BOOST_ROOT=${{ github.workspace }}/dependancies_darwin_arm64/boost_1.85.0" >> $GITHUB_ENV
            echo "OPENSSL_ROOT_DIR=${{ github.workspace }}/dependancies_darwin_arm64/openssl_3.4.0" >> $GITHUB_ENV
          fi

      - name: Build and Test BDK Unix (all linux and mac arm)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "build"
          rm -fR ./build/* && rm -fR test/golang/vendor/*

          cmake -B build -S "." -DBUILD_MODULE_GOLANG_INSTALL_INSOURCE=ON
          cmake --build build --parallel 4
          ctest --output-on-failure --test-dir build

      ## The merged GoBDK and bdkffi archives are rebuilt only when one of their
      ## input archives changed (module/gobdk/bdkcgo and module/rustbdk/capi
      ## CMakeLists.txt): building again with nothing changed must leave them, and
      ## the in-source GoBDK copy, untouched. One leg is enough.
      - name: A no-op rebuild leaves the merged archives alone
        if: matrix.os == 'ubuntu-22.04'
        timeout-minutes: 5
        run: |
          set -o pipefail
          archives=(build/x64/release/libGoBDK_*.a build/x64/release/libbdkffi_*.a module/gobdk/bdkcgo/libGoBDK_linux_x86_64.a)
          stat -c '%n %y' "${archives[@]}" | tee "${{ runner.temp }}/merged-before.txt"
          cmake --build build --parallel 4 | tee "${{ runner.temp }}/noop-build.log"
          stat -c '%n %y' "${archives[@]}" > "${{ runner.temp }}/merged-after.txt"
          diff "${{ runner.temp }}/merged-before.txt" "${{ runner.temp }}/merged-after.txt"
          if grep 'Merge all in one' "${{ runner.temp }}/noop-build.log"; then
            echo "a build with nothing changed merged an archive again"
            exit 1
          fi

      - name: Report SHA-256 backend and throughput
        if: runner.os != 'Windows'
        run: |
          uname -m
          if [[ -r /proc/cpuinfo ]]; then
            lscpu | grep 'Model name' || true
            grep -m1 'CPU part' /proc/cpuinfo || true  ## ARM: 0xd0c Neoverse N1, 0xd40 V1, 0xd49 N2, 0xd4f V2
            grep -o -m1 -w -E 'sha_ni|sha2' /proc/cpuinfo || echo "cpuinfo: no sha_ni / sha2 flag"
          else
            sysctl -n machdep.cpu.brand_string
          fi
          ctest --test-dir build -R '^test_sha256_backends$' --verbose

      - name: Check GoBDK has changed
        id: gobdk_change
        if: runner.os != 'Windows' && github.event_name == 'workflow_dispatch'
        run: |
          changed_files=$(git diff --name-only -- module/gobdk/bdkcgo/libGoBDK_*.a)
          git status
          if [[ -n "$changed_files" ]]; then
            echo "Modified files detected : $changed_files"
            echo "modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "No modifications detected"
            echo "modified=false" >> "$GITHUB_OUTPUT"
          fi

        ## Per-leg status marker, uploaded on EVERY dispatch whether or not this leg's
        ## archive changed. It is what lets the commit job tell "no archive changed"
        ## apart from "the download failed": the job derives the expected archive set
        ## from these markers and fails hard when an expected archive does not arrive.
        ## The job-level output `modified` above cannot serve that purpose -- a matrix
        ## writes one job output last-writer-wins, so a leg that changed nothing can
        ## overwrite a leg that did.
      - name: Publish gobdk change status for this leg
        if: runner.os != 'Windows' && github.event_name == 'workflow_dispatch'
        run: |
          printf 'os_arch=%s\nmodified=%s\n' \
            "${{ env.OS_ARCH }}" "${{ steps.gobdk_change.outputs.modified }}" \
            > "gobdk-status-${{ env.OS_ARCH }}.txt"

      - name: Upload gobdk change status for this leg
        if: runner.os != 'Windows' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gobdk-status-${{ env.OS_ARCH }}
          path: gobdk-status-${{ env.OS_ARCH }}.txt
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Upload GoBDK static libraries to artifact UNIX
        if: runner.os != 'Windows' && github.event_name == 'workflow_dispatch' && steps.gobdk_change.outputs.modified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libGoBDK_${{ env.OS_ARCH }}.a
          path: ./module/gobdk/bdkcgo/libGoBDK_${{ env.OS_ARCH }}.a
          retention-days: 1
          overwrite: true

      ## Validation cancellation numbers for this runner: C++ cancel latency from ctest's
      ## own log (ctest hides a passing test's output), and the per-call cost of the Go
      ## context variants over the plain call.
      - name: Print validation cancellation numbers
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          grep -E '^\[(cancelled_mid_script|cancelled_during_a_signature_hash)\]' build/Testing/Temporary/LastTest.log || true
          cd test/golang && go test -count=1 -timeout 10m -run '^$' -bench '^BenchmarkContextOverhead$' -benchtime=100ms Main_test.go CancelValidation_test.go

      - name: Prepare Environment and Dependencies for Windows
        if: runner.os == 'Windows'
        run: |
          echo "BSV_ROOT=${{ github.workspace }}\bitcoin-sv" >> $GITHUB_ENV
          Invoke-WebRequest -Uri "https://github.com/bitcoin-sv/bdk/releases/download/depcy/dependancies_windows_x86_64.zip" -OutFile "dependancies_windows_x86_64.zip"
          Expand-Archive -Path "dependancies_windows_x86_64.zip" -DestinationPath "."

      ## On windows, build and test only core C++ module
      - name: Build and Test BDK Windows
        if: runner.os == 'Windows'
        run: |
          mkdir "build"
          cmake -G"Visual Studio 17 2022" -A x64 -B "build" -S "." -DBDK_BUILD_MODULES=OFF -DBOOST_ROOT="./dependancies_windows_x86_64/boost_1.85.0" -DOPENSSL_ROOT_DIR="./dependancies_windows_x86_64/openssl_3.0.14"
          cmake --build build --config Debug --parallel 4
          ctest --output-on-failure --test-dir build -C Debug --parallel 4
          cmake --build build --config Release --parallel 4
          ctest --output-on-failure --test-dir build -C Release --parallel 4

  ## ThreadSanitizer check that the first SHA-256 backend selection cannot race
  ## with hashing: GCC, Linux, both architectures. BDK force-sets CMAKE_CXX_FLAGS,
  ## so -fsanitize=thread goes in through a compiler launcher. The positive
  ## control hashes without selecting first and must be reported.
  tsan-sha256-selection:
    needs: clang-tidy
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    ## Read-only token, set on this job only: commit-built-artifacts needs write
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Check out bitcoin-sv and dependencies
        run: |
          git clone -q https://github.com/bitcoin-sv/bitcoin-sv.git bitcoin-sv
          git -C bitcoin-sv checkout -q ${{ env.DEFAULT_BITCOIN_SV_COMMIT }}
          arch="$(uname -m)"
          wget -q "https://github.com/bitcoin-sv/bdk/releases/download/depcy/dependancies_linux_${arch}.tar.gz"
          tar -xzf "dependancies_linux_${arch}.tar.gz"
          echo "DEPS=${{ github.workspace }}/dependancies_linux_${arch}" >> "$GITHUB_ENV"
          ## Recent runner kernels randomise more address bits than TSAN's shadow layout allows
          sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build test_sha256_select_race with -fsanitize=thread
        run: |
          printf '#!/bin/sh\nexec "$@" -fsanitize=thread\n' > "$RUNNER_TEMP/tsan-launcher"
          chmod +x "$RUNNER_TEMP/tsan-launcher"
          cmake -B build-tsan -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBDK_BUILD_MODULES=OFF \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER_LAUNCHER="$RUNNER_TEMP/tsan-launcher" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$RUNNER_TEMP/tsan-launcher" \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread \
            -DBSV_ROOT="${{ github.workspace }}/bitcoin-sv" \
            -DBOOST_ROOT="$DEPS/boost_1.85.0" -DOPENSSL_ROOT_DIR="$DEPS/openssl_3.4.0"
          cmake --build build-tsan --target test_sha256_select_race --parallel 4
          test -n "$(nm -C "$(find build-tsan -name test_sha256_select_race -type f)" | grep -m1 __tsan_read)"

      - name: No race on the selecting entry points
        run: |
          bin="$(find build-tsan -name test_sha256_select_race -type f)"
          for i in 1 2 3 4 5; do
            TSAN_OPTIONS="halt_on_error=1 exitcode=66" timeout 300 "$bin" --catch_system_errors=no
          done
          BDK_SHA256_FORCE_SCALAR=1 TSAN_OPTIONS="halt_on_error=1 exitcode=66" timeout 300 "$bin" --catch_system_errors=no

      - name: Positive control is reported
        run: |
          bin="$(find build-tsan -name test_sha256_select_race -type f)"
          set +e
          BDK_TEST_SHA256_RACE_CONTROL=1 TSAN_OPTIONS="halt_on_error=0 exitcode=66" \
            timeout 300 "$bin" --catch_system_errors=no > control.log 2>&1
          rc=$?
          set -e
          grep -m1 -A12 "WARNING: ThreadSanitizer: data race" control.log || true
          echo "exit code $rc"
          test "$rc" -eq 66
          grep -q "sha256_dispatch::stream" control.log

  ## The SHA-256 instruction-set code follows the compiler's target, not the
  ## build machine: a macOS universal build must carry the ARMv8 SHA-2 transforms
  ## in its arm64 slice only and SHA-NI / SSE4 in its x86_64 slice only, both with
  ## the load-time selection. Builds bdk_core only (the dependency bundle is arm64).
  universal-sha256-slices:
    needs: clang-tidy
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Check out bitcoin-sv and dependencies
        run: |
          git clone -q https://github.com/bitcoin-sv/bitcoin-sv.git bitcoin-sv
          git -C bitcoin-sv checkout -q ${{ env.DEFAULT_BITCOIN_SV_COMMIT }}
          wget -q https://github.com/bitcoin-sv/bdk/releases/download/depcy/dependancies_darwin_arm64.tar.gz
          tar -xzf dependancies_darwin_arm64.tar.gz
          echo "DEPS=${{ github.workspace }}/dependancies_darwin_arm64" >> "$GITHUB_ENV"

      - name: Compile ARMv8 SHA-2 wrapper with generic clang target
        timeout-minutes: 2
        run: |
          clang++ -std=c++20 -arch arm64 -mcpu=generic -c core/sha256_arm_shani_target.cpp \
            -o "$RUNNER_TEMP/sha256_arm_generic.o"

      - name: Build a universal bdk_core
        run: |
          cmake -B build-universal -S . -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
            -DBDK_BUILD_MODULES=OFF -DBDK_BUILD_CORE_TESTS=OFF \
            -DBSV_ROOT="${{ github.workspace }}/bitcoin-sv" \
            -DBOOST_ROOT="$DEPS/boost_1.85.0" -DOPENSSL_ROOT_DIR="$DEPS/openssl_3.4.0"
          cmake --build build-universal --target bdk_core --parallel 4

      - name: Each slice has its own backend and only that
        run: |
          lib="$(find build-universal -name libbdk_core.a | head -1)"
          lipo -info "$lib"
          for arch in arm64 x86_64; do
            lipo -thin "$arch" "$lib" -o "core_$arch.a"
            nm -C "core_$arch.a" 2>/dev/null | grep -E ' T (sha256_arm_shani|sha256d64_arm_shani|sha256_x86_shani|sha256d64_x86_shani)::' | sed "s/^/$arch: /" || true
            mkdir -p "obj_$arch" && (cd "obj_$arch" && ar x "../core_$arch.a" sha256_arm_shani_target.cpp.o sha256_x86_shani.cpp.o sha256_hasher.cpp.o)
          done
          count() { otool -tV "$1" | grep -c "$2" || true; }
          test "$(count obj_arm64/sha256_arm_shani_target.cpp.o 'sha256h\.4s')" -gt 0
          test "$(count obj_arm64/sha256_x86_shani.cpp.o sha256rnds2)" -eq 0
          test "$(count obj_x86_64/sha256_x86_shani.cpp.o sha256rnds2)" -gt 0
          test "$(count obj_x86_64/sha256_arm_shani_target.cpp.o 'sha256h\.4s')" -eq 0
          for arch in arm64 x86_64; do
            test -n "$(nm -C "core_$arch.a" 2>/dev/null | grep 'RunSelectSha256BackendAtLoad')"
          done
          echo "arm64: ARMv8 SHA-2 only; x86_64: SHA-NI only; both select at load"

  ## Formatting gate: every first-party C++ file (core/, module/, test/, minus the
  ## upstream-derived files in BDK_UPSTREAM_DERIVED_SOURCES) must match the root
  ## .clang-format, checked with the clang-format of the same LLVM major as the
  ## clang-tidy job so a local run with clang-format-N reproduces CI. Needs only
  ## the checkout and one package, so it runs in about a minute; the log carries
  ## the diff. Locally: python3 scripts/check_clang_format.py --fix
  clang-format:
    runs-on: ubuntu-22.04

    env:
      LLVM_VERSION: 23

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clang-format ${{ env.LLVM_VERSION }}
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }}
          sudo apt-get install -y clang-format-${{ env.LLVM_VERSION }}
          clang-format-${{ env.LLVM_VERSION }} --version

      - name: Check C++ formatting
        run: python3 scripts/check_clang_format.py --clang-format clang-format-${{ env.LLVM_VERSION }}

  ## Static-analysis gate: C++ only. Compiles every first-party C++ target (core,
  ## examples, C++ tests, and the Go/Rust cgo and C-ABI shims) with clang and
  ## CMAKE_CXX_CLANG_TIDY (see cmake/BDKClangTidy.cmake and the root .clang-tidy),
  ## so a clang-tidy finding in first-party C++ fails the compile itself, and
  ## with BDK_WARNINGS_AS_ERRORS so does a compiler warning. Only core/, module/
  ## and test/ are linted and held to -Werror; bitcoin-sv and generated sources
  ## are skipped. No ctest, so `go test` and `cargo` never run; Go is not installed
  ## (configure only warns and skips the Go test registration), and cargo is only
  ## required to exist at configure time, which the runner satisfies. The
  ## toolchain is pinned to one LLVM major from apt.llvm.org so local runs with
  ## the same clang-tidy-N reproduce CI exactly. Runs after the clang-format job;
  ## the build matrix and sanitiser jobs need this one, and so both, transitively.
  clang-tidy:
    needs: clang-format
    runs-on: ubuntu-22.04

    env:
      LLVM_VERSION: 23

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Define dependant bitcoin-sv commit
        id: define-bitcoin-sv-commit
        shell: bash
        run: |
          # Use dispatch input if present, otherwise default from env
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bsvcommit="${{ github.event.inputs.bitcoin-sv-commit }}"
          else
            bsvcommit="${{ env.DEFAULT_BITCOIN_SV_COMMIT }}"
          fi
          echo "Build using bsvcommit=$bsvcommit ..."
          echo "bsvcommit=$bsvcommit" >> "$GITHUB_OUTPUT"

      - name: Check out bitcoin-sv
        shell: bash
        run: |
          echo "Checking out bitcoin-sv at commit ${{ steps.define-bitcoin-sv-commit.outputs.bsvcommit }} ..."
          git clone https://github.com/bitcoin-sv/bitcoin-sv.git bitcoin-sv
          cd bitcoin-sv && git checkout ${{ steps.define-bitcoin-sv-commit.outputs.bsvcommit }} && git log -3 && pwd && cd ..
          echo "Successfully checked out bitcoin-sv commit ${{ steps.define-bitcoin-sv-commit.outputs.bsvcommit }} to bitcoin-sv"

      - name: Install LLVM ${{ env.LLVM_VERSION }} (clang + clang-tidy)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }}
          sudo apt-get install -y clang-${{ env.LLVM_VERSION }} clang-tidy-${{ env.LLVM_VERSION }}
          clang++-${{ env.LLVM_VERSION }} --version
          clang-tidy-${{ env.LLVM_VERSION }} --version

      - name: Prepare Environment and Dependencies
        run: |
          echo "BSV_ROOT=${{ github.workspace }}/bitcoin-sv" >> $GITHUB_ENV
          sudo apt-get install -y build-essential wget
          wget https://github.com/bitcoin-sv/bdk/releases/download/depcy/dependancies_linux_x86_64.tar.gz
          tar -xzf dependancies_linux_x86_64.tar.gz
          echo "DEPENDENCIES_DIR=${{ github.workspace }}/dependancies_linux_x86_64" >> $GITHUB_ENV
          echo "BOOST_ROOT=${{ github.workspace }}/dependancies_linux_x86_64/boost_1.85.0" >> $GITHUB_ENV
          echo "OPENSSL_ROOT_DIR=${{ github.workspace }}/dependancies_linux_x86_64/openssl_3.4.0" >> $GITHUB_ENV

      - name: Build BDK with clang-tidy
        run: |
          mkdir -p "build"
          rm -fR ./build/* && rm -fR test/golang/vendor/*

          cmake -B build -S "." \
            -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }} \
            -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }} \
            -DBDK_CLANG_TIDY_EXE=/usr/bin/clang-tidy-${{ env.LLVM_VERSION }} \
            -DBDK_ENABLE_CLANG_TIDY=ON \
            -DBDK_WARNINGS_AS_ERRORS=ON \
            -DBUILD_MODULE_GOLANG_INSTALL_INSOURCE=OFF \
            -DBUILD_MODULE_RUST_INSTALL_INSOURCE=OFF
          cmake --build build --parallel 4

  ## The wasm leg runs on EVERY dispatch, regardless of either checkbox. That is what
  ## makes the all-or-nothing gate meaningful: a red wasm leg blocks the gobdk commit
  ## too. With commit-wasm-artifacts unticked it builds and tests but never publishes
  ## in-source, so it leaves the tracked tree clean and reports `modified` empty.
  build-wasm:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/build_wasm.yaml
    with:
      bitcoin-sv-commit: ${{ github.event.inputs.bitcoin-sv-commit }}
      publish-artifacts: ${{ github.event.inputs.commit-wasm-artifacts == 'true' }}

  commit-built-artifacts:
    runs-on: ubuntu-latest
    needs: [build-bdk, build-wasm, clang-tidy]
    # Default success() semantics: ANY red leg blocks ALL commits, including the
    # un-ticked artifact and the clang-tidy gate. Dispatch-only, and at least one
    # box must be ticked.
    # Whether anything actually CHANGED is decided per family by the staged diff
    # inside the job -- never by a matrix job's last-writer-wins output.
    if: ${{ github.event_name == 'workflow_dispatch' && success() && (
            github.event.inputs.commit-gobdk-archives == 'true'
            || github.event.inputs.commit-wasm-artifacts == 'true'
          ) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

        ## Loop-breaker markers, read from git rather than from
        ## github.event.head_commit.message: that context is populated for `push`
        ## events only, so on the dispatch trigger that is the only way into this job
        ## an expression guard would evaluate contains(null, ...) -> false and never
        ## suppress anything. Each artifact family carries its own marker, and each
        ## marker suppresses only its own family's rebuild loop.
      - name: Read loop-breaker markers from the head commit
        id: markers
        run: |
          subject="$(git log -1 --pretty=%B)"
          grep -q '\[GoBDKUpdate\]'   <<<"$subject" && echo "gobdk_marker=true"  >> "$GITHUB_OUTPUT" || echo "gobdk_marker=false" >> "$GITHUB_OUTPUT"
          grep -q '\[WasmBDKUpdate\]' <<<"$subject" && echo "wasm_marker=true"   >> "$GITHUB_OUTPUT" || echo "wasm_marker=false"  >> "$GITHUB_OUTPUT"

        ## `pattern:` downloads create one subdirectory per artifact unless
        ## merge-multiple is set, and each gobdk artifact is named after the file it
        ## contains (extension included), so a flat-path assumption would look at a
        ## directory named exactly like the file. Every artifact family gets its own
        ## path as well: the always-uploaded `bdk-wasm` dist artifact carries the same
        ## bdk-core.* file names as `bdk-wasm-artifacts`.
      - name: Download the gobdk status markers
        if: github.event.inputs.commit-gobdk-archives == 'true' && steps.markers.outputs.gobdk_marker != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: gobdk-status-*
          path: ./tmp_status
          merge-multiple: true

        ## success() on needs already guarantees every matrix leg finished, so all
        ## three Unix legs must have uploaded a marker; fewer is a real fault and goes
        ## red. The count is hard-coded from the matrix length on purpose: adding a
        ## platform must be a deliberate edit here.
      - name: Derive the expected gobdk archive set
        id: gobdk_expect
        if: github.event.inputs.commit-gobdk-archives == 'true' && steps.markers.outputs.gobdk_marker != 'true'
        run: |
          mapfile -t markers < <(find ./tmp_status -type f -name 'gobdk-status-*.txt' | sort)
          found=${#markers[@]}
          [ "$found" -eq 3 ] || { echo "expected 3 gobdk status markers, found $found" >&2; exit 1; }
          expected=""
          for marker in "${markers[@]}"; do
            cat "$marker"
            if grep -q '^modified=true$' "$marker"; then
              expected="$expected $(sed -n 's/^os_arch=//p' "$marker")"
            fi
          done
          expected="$(echo $expected)"
          if [ -n "$expected" ]; then
            echo "legs reporting a changed archive: $expected"
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "no gobdk archive changed"
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          echo "expected=$expected" >> "$GITHUB_OUTPUT"

      - name: Download the changed gobdk static libraries
        if: github.event.inputs.commit-gobdk-archives == 'true' && steps.markers.outputs.gobdk_marker != 'true' && steps.gobdk_expect.outputs.any == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: libGoBDK_*
          path: ./tmp_artifact_gobdk
          merge-multiple: true

        ## Assert every archive a leg said it changed actually arrived, then move it.
        ## A recursive find keeps this correct whether or not merge-multiple survives a
        ## future edit. Nothing here tolerates a failed download: a missing expected
        ## archive fails the job instead of silently committing nothing.
      - name: Move the changed gobdk static libraries into place
        if: github.event.inputs.commit-gobdk-archives == 'true' && steps.markers.outputs.gobdk_marker != 'true' && steps.gobdk_expect.outputs.any == 'true'
        run: |
          for os_arch in ${{ steps.gobdk_expect.outputs.expected }}; do
            archive="$(find ./tmp_artifact_gobdk -type f -name "libGoBDK_${os_arch}.a" -print -quit)"
            [ -n "$archive" ] \
              || { echo "leg $os_arch reported a changed archive but it did not arrive" >&2; exit 1; }
            mv "$archive" ./module/gobdk/bdkcgo/
          done
          ls ./module/gobdk/bdkcgo/

        ## `build-wasm` is a single job, so its `modified` output is unambiguous. It is
        ## used only to skip a download that would find nothing -- the artifact is
        ## uploaded exactly when the tracked bytes changed, so a `name:` download would
        ## otherwise 404. `name:` unpacks flat, hence no merge-multiple here.
      - name: Download the refreshed wasm artifacts
        if: github.event.inputs.commit-wasm-artifacts == 'true' && needs.build-wasm.outputs.modified == 'true' && steps.markers.outputs.wasm_marker != 'true'
        uses: actions/download-artifact@v4
        with:
          name: bdk-wasm-artifacts
          path: ./tmp_artifact_wasm

      - name: Move the refreshed wasm artifacts into place
        if: github.event.inputs.commit-wasm-artifacts == 'true' && needs.build-wasm.outputs.modified == 'true' && steps.markers.outputs.wasm_marker != 'true'
        run: |
          for artifact in bdk-core.mjs bdk-core.wasm \
                          bdk-core.browser.mjs bdk-core.browser.wasm \
                          bdk-core.umd.js bdk-core.umd.wasm \
                          bdk-core.slim.umd.js bdk-core.slim.umd.wasm; do
            [ -f "./tmp_artifact_wasm/$artifact" ] \
              || { echo "wasm leg reported changed artifacts but $artifact did not arrive" >&2; exit 1; }
            mv "./tmp_artifact_wasm/$artifact" ./module/typesbdk/wasm/
          done
          ls ./module/typesbdk/wasm/

      - name: Configure the bot git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

        ## `git diff --cached --quiet` is the AUTHORITATIVE per-family change decision:
        ## an empty staged set means nothing changed, whatever any leg reported. The
        ## marker/assertion steps above have already proven that every archive a leg
        ## said it changed did arrive, so this is a second line of defence rather than
        ## the only one. Two commits, one per family, are intentional: each carries the
        ## marker that suppresses its own rebuild loop and each is independently
        ## revertable.
      - name: Stage and commit the gobdk static libraries
        if: github.event.inputs.commit-gobdk-archives == 'true' && steps.markers.outputs.gobdk_marker != 'true'
        run: |
          # The glob always matches the three tracked archives, whatever was downloaded
          # (a `git add` glob matching nothing is an error).
          git add ./module/gobdk/bdkcgo/libGoBDK_*_*.a
          git status
          if ! git diff --cached --quiet; then
            git commit -m "[bot] [GoBDKUpdate] Update gobdk static libraries changes"
          else
            echo "No gobdk changes to commit"
          fi

      - name: Stage and commit the typesbdk wasm artifacts
        if: github.event.inputs.commit-wasm-artifacts == 'true' && steps.markers.outputs.wasm_marker != 'true'
        run: |
          git add ./module/typesbdk/wasm/bdk-core.mjs  ./module/typesbdk/wasm/bdk-core.wasm \
                  ./module/typesbdk/wasm/bdk-core.browser.mjs ./module/typesbdk/wasm/bdk-core.browser.wasm \
                  ./module/typesbdk/wasm/bdk-core.umd.js ./module/typesbdk/wasm/bdk-core.umd.wasm \
                  ./module/typesbdk/wasm/bdk-core.slim.umd.js ./module/typesbdk/wasm/bdk-core.slim.umd.wasm
          git status
          if ! git diff --cached --quiet; then
            git commit -m "[bot] [WasmBDKUpdate] Update typesbdk wasm artifacts"
          else
            echo "No wasm artifact changes to commit"
          fi

        ## Exactly ONE push, at the end, after both commit steps. Two jobs pushing to
        ## the same branch race; a single job that stages both families and pushes once
        ## cannot. A run that committed nothing pushes an already-current branch, which
        ## is a no-op. github.ref_name is the dispatched branch -- github.head_ref is a
        ## pull-request-only value and is empty on workflow_dispatch.
      - name: Push the artifact commits
        run: |
          BRANCH_NAME=${{ github.ref_name }}
          echo "BRANCH_NAME=$BRANCH_NAME"
          git log -3
          git push -u origin "$BRANCH_NAME"
