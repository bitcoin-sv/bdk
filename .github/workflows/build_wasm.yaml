name: Build BDK WASM

## This workflow has NO manual trigger, deliberately. `build_bdk.yaml` is the single
## manual dispatch entry for this pipeline: it calls this workflow through
## `workflow_call`, so a red wasm leg blocks the gobdk commit too. A wasm-only manual
## run is a `build_bdk.yaml` dispatch with both commit boxes unticked -- it builds and
## tests both legs and commits nothing -- and a custom bitcoin-sv commit is that
## workflow's `bitcoin-sv-commit` input, forwarded below.
##
## `publish-artifacts` is the ONLY thing that ever writes the eight tracked artifacts
## under module/typesbdk/wasm/. PR and push runs build and test in the build tree and
## leave the tracked files untouched.
on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'core/**'
      - 'module/typesbdk/wasm/**'
      - 'test/types/**'
      - '.github/workflows/build_wasm.yaml'
  push:
    branches: [master]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'core/**'
      - 'module/typesbdk/wasm/**'
      - 'test/types/**'
      - '.github/workflows/build_wasm.yaml'
  workflow_call:
    inputs:
      bitcoin-sv-commit:
        required: false
        type: string
        default: 879fc8b42168dd0e608dafd51b39c6dabad37d4d
      publish-artifacts:
        description: 'Publish the freshly built artifacts in-source and upload them for the commit job'
        required: false
        type: boolean
        default: false
    outputs:
      modified:
        description: 'true when the freshly built artifacts differ from the committed ones'
        value: ${{ jobs.wasm.outputs.modified }}

env:
  DEFAULT_BITCOIN_SV_COMMIT: 879fc8b42168dd0e608dafd51b39c6dabad37d4d

jobs:
  wasm:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      modified: ${{ steps.wasm_change.outputs.modified }}
    steps:
      - uses: actions/checkout@v4

      - name: Define dependant bitcoin-sv commit
        id: define-bitcoin-sv-commit
        shell: bash
        run: |
          # workflow_call supplies the commit; PR/push runs supply nothing and take the pin.
          bsvcommit="${{ inputs.bitcoin-sv-commit }}"
          [ -n "$bsvcommit" ] || bsvcommit="${{ env.DEFAULT_BITCOIN_SV_COMMIT }}"
          echo "Build using bsvcommit=$bsvcommit ..."
          echo "bsvcommit=$bsvcommit" >> "$GITHUB_OUTPUT"

        ## This checkout is what pins the effective bitcoin-sv commit: it is
        ## exported as BSV_ROOT below and the build system simply consumes it.
      - name: Check out bitcoin-sv
        shell: bash
        run: |
          echo "Checking out bitcoin-sv at commit ${{ steps.define-bitcoin-sv-commit.outputs.bsvcommit }} ..."
          git clone https://github.com/bitcoin-sv/bitcoin-sv.git bitcoin-sv
          cd bitcoin-sv && git checkout ${{ steps.define-bitcoin-sv-commit.outputs.bsvcommit }} && git log -3 && pwd && cd ..
          echo "Successfully checked out bitcoin-sv commit ${{ steps.define-bitcoin-sv-commit.outputs.bsvcommit }} to bitcoin-sv"
          echo "BSV_ROOT=${{ github.workspace }}/bitcoin-sv" >> $GITHUB_ENV

      - name: Install Emscripten 4.0.23
        run: |
          git clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.23

        ## CI validates the pinned minimal Boost component set on every run:
        ## a new boost include anywhere in the wasm compile set fails with a
        ## missing-header error instead of rotting silently.
      - name: Provision pinned minimal Boost package
        run: |
          curl --fail --location --retry 3 -o dependancies_wasm.tar.gz \
            "https://github.com/bitcoin-sv/bdk/releases/download/depcy/dependancies_wasm.tar.gz"
          tar -xzf dependancies_wasm.tar.gz
          # Byte-repro layout rule: BOOST_ROOT is the directory containing boost/ directly
          echo "BOOST_ROOT=$PWD/dependancies_wasm/boost_1.85.0" >> "$GITHUB_ENV"

        ## build.sh builds only; it never writes the tracked artifacts and never runs
        ## a test. Validation is the separate ctest step below.
      - name: Build the wasm module
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          module/typesbdk/wasm/build.sh

        ## Green/red only. The registration list is asserted BY NAME, not by count:
        ## without `node` at configure time ten of the twelve registrations silently
        ## vanish and the remaining two pass, so a count check cannot tell a healthy
        ## tree from a node-less one. This is a presence check, so adding a test needs
        ## no CI edit. The repository CMake floor is 3.16, which has neither
        ## --test-dir nor --no-tests=error, hence the `cd` and the manual check.
      - name: Run the wasm test suites
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cd build-wasm
          registered="$(ctest -N)"
          for expected in wasm_build_optimized wasm_size_gate \
                          wasm_functional_node wasm_functional_browser \
                          wasm_functional_umd wasm_functional_slim_umd \
                          wasm_secp256k1_build \
                          wasm_secp256k1_tests wasm_secp256k1_noverify_tests \
                          wasm_secp256k1_first_call_parity \
                          wasm_secp256k1_verify_corpus wasm_secp256k1_verify_parity_node; do
            grep -q "[[:space:]]${expected}\$" <<<"$registered" || {
              echo "CTest registration missing: $expected (node absent at configure time?)" >&2
              exit 1
            }
          done
          ctest --output-on-failure

        ## Proves the recipe/factory path works without build.sh's environment
        ## and catches any future re-coupling of the wasm build to root state.
      - name: Standalone configure smoke (direct emcmake, no build.sh)
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-wasm-direct -DCMAKE_BUILD_TYPE=Release \
            -DBDK_BUILD_CORE=OFF -DBDK_BUILD_WASM=ON \
            -DBSV_ROOT="$BSV_ROOT" \
            -DBOOST_ROOT="$BOOST_ROOT" \
            -DSECP256K1_ASM=OFF -DSECP256K1_BUILD_BENCHMARK=OFF \
            -DSECP256K1_ECMULT_WINDOW_SIZE=15 -DSECP256K1_ECMULT_GEN_KB=2 \
            -DSECP256K1_TEST_OVERRIDE_WIDE_MULTIPLY=int64
          cmake --build build-wasm-direct --target bdk_wasm --parallel

        ## The only step that writes the tracked artifacts, and only when the caller
        ## asked for it. The default-pin condition is deliberate: an off-pin build
        ## produces off-pin bytes and must never overwrite the tracked ones.
        ##
        ## There is no reproducibility gate any more: the tracked artifacts are a
        ## refreshed-on-demand convenience, exactly like module/gobdk's libGoBDK_*.a.
        ## Drift between them and a fresh build is expected between refreshes, so a
        ## source change no longer has to carry regenerated binaries. No report
        ## replaces the gate either -- a publish-and-restore report would keep every
        ## PR run writing the tracked files to compute a diff nobody acts on.
      - name: Publish the freshly built artifacts in-source
        if: inputs.publish-artifacts && steps.define-bitcoin-sv-commit.outputs.bsvcommit == env.DEFAULT_BITCOIN_SV_COMMIT
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --build build-wasm --target bdk_wasm_install_insource

      - name: Check the committed wasm artifacts have changed
        id: wasm_change
        if: inputs.publish-artifacts && steps.define-bitcoin-sv-commit.outputs.bsvcommit == env.DEFAULT_BITCOIN_SV_COMMIT
        run: |
          changed_files=$(git diff --name-only -- \
            module/typesbdk/wasm/bdk-core.mjs \
            module/typesbdk/wasm/bdk-core.wasm \
            module/typesbdk/wasm/bdk-core.browser.mjs \
            module/typesbdk/wasm/bdk-core.browser.wasm \
            module/typesbdk/wasm/bdk-core.umd.js \
            module/typesbdk/wasm/bdk-core.umd.wasm \
            module/typesbdk/wasm/bdk-core.slim.umd.js \
            module/typesbdk/wasm/bdk-core.slim.umd.wasm)
          git status
          if [[ -n "$changed_files" ]]; then
            echo "Modified files detected : $changed_files"
            echo "modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "No modifications detected"
            echo "modified=false" >> "$GITHUB_OUTPUT"
          fi

        ## Transport to the commit job in build_bdk.yaml, mirroring how libGoBDK_*.a
        ## travels today. Uploaded only when the tracked bytes actually changed, so
        ## the commit job's `name:` download is either present or a real failure.
      - name: Upload the refreshed committed artifacts
        if: steps.wasm_change.outputs.modified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bdk-wasm-artifacts
          path: |
            module/typesbdk/wasm/bdk-core.mjs
            module/typesbdk/wasm/bdk-core.wasm
            module/typesbdk/wasm/bdk-core.browser.mjs
            module/typesbdk/wasm/bdk-core.browser.wasm
            module/typesbdk/wasm/bdk-core.umd.js
            module/typesbdk/wasm/bdk-core.umd.wasm
            module/typesbdk/wasm/bdk-core.slim.umd.js
            module/typesbdk/wasm/bdk-core.slim.umd.wasm
          retention-days: 1
          overwrite: true
          if-no-files-found: error

        ## Upload the artifacts build.sh actually produced (the build-tree dist
        ## directory), not the tracked source-tree copies. On a custom-commit run
        ## the tracked tree still holds the default-pin bytes, so uploading it
        ## would publish output that does not match what this run built. The dist
        ## directory always reflects the current build regardless of the pin.
      - name: Upload validated module
        uses: actions/upload-artifact@v4
        with:
          name: bdk-wasm
          path: |
            build-wasm/module/typesbdk/wasm/dist/bdk-core.mjs
            build-wasm/module/typesbdk/wasm/dist/bdk-core.wasm
            build-wasm/module/typesbdk/wasm/dist/bdk-core.browser.mjs
            build-wasm/module/typesbdk/wasm/dist/bdk-core.browser.wasm
            build-wasm/module/typesbdk/wasm/dist/bdk-core.umd.js
            build-wasm/module/typesbdk/wasm/dist/bdk-core.umd.wasm
            build-wasm/module/typesbdk/wasm/dist/bdk-core.slim.umd.js
            build-wasm/module/typesbdk/wasm/dist/bdk-core.slim.umd.wasm
          if-no-files-found: error
