name: Build BDK WASM

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'core/**'
      - 'module/typesbdk/wasm/**'
      - '.github/workflows/build_wasm.yaml'
  push:
    branches: [master]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'core/**'
      - 'module/typesbdk/wasm/**'
      - '.github/workflows/build_wasm.yaml'
  workflow_dispatch:
    inputs:
      bitcoin-sv-commit:
        description: 'Custom bitcoin-sv commit to be used to build bdk'
        required: false
        default: 879fc8b42168dd0e608dafd51b39c6dabad37d4d

env:
  DEFAULT_BITCOIN_SV_COMMIT: 879fc8b42168dd0e608dafd51b39c6dabad37d4d

jobs:
  wasm:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Define dependant bitcoin-sv commit
        id: define-bitcoin-sv-commit
        shell: bash
        run: |
          # Use dispatch input if present, otherwise default from env
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bsvcommit="${{ github.event.inputs.bitcoin-sv-commit }}"
          else
            bsvcommit="${{ env.DEFAULT_BITCOIN_SV_COMMIT }}"
          fi
          echo "Build using bsvcommit=$bsvcommit ..."
          echo "bsvcommit=$bsvcommit" >> "$GITHUB_OUTPUT"

        ## build.sh enforces its own pinned commit against the supplied
        ## BSV_ROOT, so a mismatched dispatch input fails loudly there --
        ## that check is the reproducibility guard.
      - name: Check out bitcoin-sv
        shell: bash
        run: |
          echo "Checking out bitcoin-sv at commit ${{ steps.define-bitcoin-sv-commit.outputs.bsvcommit }} ..."
          git clone https://github.com/bitcoin-sv/bitcoin-sv.git bitcoin-sv
          cd bitcoin-sv && git checkout ${{ steps.define-bitcoin-sv-commit.outputs.bsvcommit }} && git log -3 && pwd && cd ..
          echo "Successfully checked out bitcoin-sv commit ${{ steps.define-bitcoin-sv-commit.outputs.bsvcommit }} to bitcoin-sv"
          echo "BSV_ROOT=${{ github.workspace }}/bitcoin-sv" >> $GITHUB_ENV

      - name: Install Emscripten 4.0.23
        run: |
          git clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.23
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.23

        ## CI validates the pinned minimal Boost component set on every run:
        ## a new boost include anywhere in the wasm compile set fails with a
        ## missing-header error instead of rotting silently.
      - name: Provision pinned minimal Boost package
        run: |
          curl --fail --location --retry 3 -o dependancies_wasm.tar.gz \
            "https://github.com/bitcoin-sv/bdk/releases/download/depcy/dependancies_wasm.tar.gz"
          tar -xzf dependancies_wasm.tar.gz
          # Byte-repro layout rule: BOOST_ROOT is the directory containing boost/ directly
          echo "BOOST_ROOT=$PWD/dependancies_wasm/boost_1.85.0" >> "$GITHUB_ENV"

      - name: Build and run curve tests and real transaction vectors
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          module/typesbdk/wasm/build.sh

        ## Proves the recipe/factory path works without build.sh's environment
        ## and catches any future re-coupling of the wasm build to root state.
      - name: Standalone configure smoke (direct emcmake, no build.sh)
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build-wasm-direct -DCMAKE_BUILD_TYPE=Release \
            -DBDK_BUILD_CORE=OFF -DBDK_BUILD_WASM=ON \
            -DBSV_ROOT="$BSV_ROOT" \
            -DBOOST_ROOT="$BOOST_ROOT" \
            -DSECP256K1_ASM=OFF -DSECP256K1_BUILD_BENCHMARK=OFF \
            -DSECP256K1_ECMULT_WINDOW_SIZE=15 -DSECP256K1_ECMULT_GEN_KB=2 \
            -DSECP256K1_TEST_OVERRIDE_WIDE_MULTIPLY=int64
          cmake --build build-wasm-direct --target bdk_wasm --parallel

      - name: Verify committed artifacts are reproducible
        run: |
          git diff --exit-code -- \
            module/typesbdk/wasm/bdk-core.mjs \
            module/typesbdk/wasm/bdk-core.wasm \
            module/typesbdk/wasm/bdk-core.browser.mjs \
            module/typesbdk/wasm/bdk-core.browser.wasm \
            module/typesbdk/wasm/bdk-core.umd.js \
            module/typesbdk/wasm/bdk-core.umd.wasm \
            module/typesbdk/wasm/bdk-core.slim.umd.js \
            module/typesbdk/wasm/bdk-core.slim.umd.wasm

      - name: Upload validated module
        uses: actions/upload-artifact@v4
        with:
          name: bdk-wasm
          path: |
            module/typesbdk/wasm/bdk-core.mjs
            module/typesbdk/wasm/bdk-core.wasm
            module/typesbdk/wasm/bdk-core.browser.mjs
            module/typesbdk/wasm/bdk-core.browser.wasm
            module/typesbdk/wasm/bdk-core.umd.js
            module/typesbdk/wasm/bdk-core.umd.wasm
            module/typesbdk/wasm/bdk-core.slim.umd.js
            module/typesbdk/wasm/bdk-core.slim.umd.wasm
          if-no-files-found: error
