[package]
name = "rust-bdk"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
bench = ["bdk-sys/bench"]

[dependencies]
bdk-sys = { path = "../bdk-sys" }

[dev-dependencies]
criterion = "0.5"

# Examples and benches link the local `libbdkffi` archive. Run `cmake --build`
# first so `module/rustbdk/bdk-sys/lib/libbdkffi_*.a` exists.
# The integration test suite lives in test/rust (an independent external
# consumer, mirroring test/golang), not in this crate.

[[example]]
name = "txvalidator"
path = "examples/txvalidator.rs"

[[example]]
name = "create_validate"
path = "examples/create_validate.rs"

[[example]]
name = "special_opcode"
path = "examples/special_opcode.rs"

[[example]]
name = "num2bin_memory_attack"
path = "examples/num2bin_memory_attack.rs"

[[bench]]
name = "ffi"
path = "benches/ffi.rs"
harness = false
required-features = ["bench"]

[[bench]]
name = "validation"
path = "benches/validation.rs"
harness = false
required-features = ["bench"]
